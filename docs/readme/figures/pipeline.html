<!doctype html>
<html><head><meta charset="utf-8"><title>Pipeline figure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="figure.css">
<style>
.pg{display:grid;grid-template-columns:180px repeat(4,minmax(0,1fr));column-gap:44px;grid-template-rows:auto auto auto}
.col{grid-row:1/4;display:grid;grid-template-rows:subgrid;row-gap:22px;padding:18px 18px 18px}
.col .gt{margin:0}
.lanel{display:block;align-self:start;padding-top:2px;font-weight:700;font-size:22px;line-height:1.3}
.cell{display:flex;flex-direction:column;gap:14px}
.where{margin-top:4px;font-size:20px;color:var(--sub);font-weight:500;line-height:1.3}
.hdr{background:var(--bs);border:2.5px solid var(--ink);border-radius:12px;padding:6px 12px;color:var(--ba)}
</style></head>
<body><div id="fig">
<div class="pg">
  <div style="grid-column:1;grid-row:1"></div>
  <div class="lanel" style="grid-column:1;grid-row:2" data-t="laneA"></div>
  <div class="lanel" style="grid-column:1;grid-row:3" data-t="laneB"></div>

  <div class="cont amber col" id="c1" style="grid-column:2">
    <div class="gt" id="h1" data-t="c1"></div>
    <div class="cell"><div class="box" id="a1"><div class="bt" data-t="a1t"></div><div class="b2" data-t="a1s"></div></div></div>
    <div class="cell"><div class="box" id="b1"><div class="bt" data-t="b1t"></div><div class="b2" data-t="b1s"></div></div><div class="where" data-t="w1"></div></div>
  </div>
  <div class="cont slate col" id="c2" style="grid-column:3">
    <div class="gt" id="h2" data-t="c2"></div>
    <div class="cell"><div class="box" id="a2"><div class="bt" data-t="a2t"></div><div class="b2" data-t="a2s"></div></div></div>
    <div class="cell"><div class="box" id="b2"><div class="bt" data-t="b2t"></div><div class="b2" data-t="b2s"></div></div><div class="where" data-t="w2"></div></div>
  </div>
  <div class="cont blue col" id="c3" style="grid-column:4">
    <div class="gt" id="h3" data-t="c3"></div>
    <div class="cell"><div class="box" id="a3"><div class="bt" data-t="a3t"></div><div class="b2" data-t="a3s"></div></div>
      <div class="box dash" id="a3m"><div class="bt" data-t="a3mt"></div><div class="b2" data-t="a3ms"></div></div></div>
    <div class="cell"><div class="box" id="b3"><div class="bt" data-t="b3t"></div><div class="b2" data-t="b3s"></div></div><div class="where" data-t="w3"></div></div>
  </div>
  <div class="cont blue col" id="c4" style="grid-column:5">
    <div class="gt hdr" id="h4" data-t="c4"></div>
    <div class="cell"><div class="box" id="a4"><div class="bt" data-t="a4t"></div><div class="b2" data-t="a4s"></div></div></div>
    <div class="cell"><div class="box" id="b4"><div class="bt" data-t="b4t"></div><div class="b2" data-t="b4s"></div></div>
      <div class="box dash" id="b4m"><div class="bt" data-t="b4mt"></div><div class="b2" data-t="b4ms"></div></div><div class="where" data-t="w4"></div></div>
  </div>
</div>
<div class="legend">
  <span><span class="sw" style="background:#fff"></span><span data-t="lg.solid"></span></span>
  <span><span class="sw" style="background:#fff;border-style:dashed"></span><span data-t="lg.dash"></span></span>
  <span><span class="sw" style="background:var(--as)"></span><span data-t="lg.amber"></span></span>
  <span><span class="sw" style="background:var(--ss)"></span><span data-t="lg.slate"></span></span>
  <span><span class="sw" style="background:var(--bs)"></span><span data-t="lg.blue"></span></span>
</div>
</div>
<script src="figure.js"></script>
<script>
const T = {
 laneA:{en:'A&nbsp;·&nbsp;A place in the sky',ko:'A · 하늘의 한 위치'},
 laneB:{en:'B&nbsp;·&nbsp;Asteroids',ko:'B · 소행성'},
 c1:{en:'1 Collect',ko:'1 수집'}, c2:{en:'2 Process',ko:'2 처리'}, c3:{en:'3 Analyse',ko:'3 분석'}, c4:{en:'4 Show',ko:'4 보여 주기'},
 a1t:{en:'SPHEREx images, NASA/IPAC IRSA',ko:'SPHEREx 영상, NASA/IPAC IRSA'},
 a1s:{en:'TAP exposure search and IBE cut-outs (bake.py)',ko:'TAP으로 노출 검색, IBE로 잘라 오기 (bake.py)'},
 b1t:{en:'Exposures on the predicted path',ko:'예측 경로 위의 노출'},
 b1s:{en:'JPL SBDB and Horizons, IRSA MOST (spherex_search.py)',ko:'JPL SBDB, Horizons, IRSA MOST (spherex_search.py)'},
 a2t:{en:'Reprojection onto one north-up grid',ko:'북쪽이 위인 한 격자로 재투영'},
 a2s:{en:'frames, photometry and meta.json for 5 prepared targets',ko:'준비된 대상 5개의 frames, 측광, meta.json'},
 b2t:{en:'Forced PSF photometry, 0.75 to 5.0 µm',ko:'강제 PSF 측광, 0.75~5.0 µm'},
 b2s:{en:'reflected and thermal light separated with the NEATM model',ko:'NEATM 모델로 반사광과 열복사 분리'},
 a3t:{en:'Motion, variability, spectrum',ko:'움직임, 변광, 스펙트럼'},
 a3s:{en:'computed from the baked float32 frames (fit.ts, variability.ts, spectral.ts)',ko:'미리 만든 float32 frames로 계산 (fit.ts, variability.ts, spectral.ts)'},
 a3mt:{en:'Computed · model',ko:'계산·모델'},
 a3ms:{en:'blackbody shape fit: "K blackbody (model)"',ko:'흑체 모양 맞춤: "K blackbody (model)"'},
 b3t:{en:'Type, diameter, H, albedo',ko:'유형, 지름, H, 알베도'},
 b3s:{en:'exported at build time to analysis-data (23 targets)',ko:'빌드 때 analysis-data로 내보냄 (대상 23개)'},
 a4t:{en:'Sky View and Analyse screens',ko:'천구 관찰, 분석 화면'},
 a4s:{en:'all-sky map streamed live from the IRSA SPHEREx HiPS; Positions, Variability, Spectrum, Provenance tabs',ko:'IRSA SPHEREx HiPS 전천 지도를 실시간으로 불러옴. 위치, 변광, 스펙트럼, 출처 탭'},
 b4t:{en:'Results and Orbit 3D',ko:'분석 결과, 궤도·3D'},
 b4s:{en:'analysis-data index.json; Horizons paths and real exposure images from public/data',ko:'analysis-data index.json. public/data의 Horizons 경로와 실제 노출 영상'},
 b4mt:{en:'Model · illustrative',ko:'모형·설명용'},
 b4ms:{en:'Orbit 3D: "sizes are illustrative". Image model: ePSF at the JPL predicted position',ko:'궤도·3D: "크기는 설명용". 영상 모형: JPL 예측 위치의 ePSF'},
 w1:{en:'Runs in the Python services, ahead of time',ko:'Python 서비스에서 미리 실행'},
 w2:{en:'Runs in the Python services, ahead of time',ko:'Python 서비스에서 미리 실행'},
 w3:{en:"A: visitor's browser · B: Python, ahead of time",ko:'A: 방문자 브라우저 · B: Python에서 미리'},
 w4:{en:"Runs in the visitor's browser",ko:'방문자의 브라우저에서 실행'},
 'lg.solid':{en:'solid outline = always present',ko:'실선 = 항상 있음'},
 'lg.dash':{en:'dashed = model or illustrative, as the site labels it',ko:'점선 = 사이트가 모델·설명용이라고 밝힌 부분'},
 'lg.amber':{en:'outside archives',ko:'외부 아카이브'},'lg.slate':{en:'processing',ko:'처리'},'lg.blue':{en:'analysis and screens',ko:'분석과 화면'},
};
const W=[];
for(const [p,q] of [['c1','c2'],['c2','c3'],['c3','c4']]) W.push({from:p,fromSide:'right',ft:.035,to:q,toSide:'left',tt:.035,w:5});
for(const [p,q] of [['a1','a2'],['a2','a3'],['a3','a4'],['b1','b2'],['b2','b3'],['b3','b4']]) W.push({from:p,fromSide:'right',to:q,toSide:'left',via:[{x:'right:'+p,d:43}]});
window.figReady=(async()=>{ Fig.fill(T); await document.fonts.ready;
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); Fig.draw(W); })();
</script>
</body></html>
