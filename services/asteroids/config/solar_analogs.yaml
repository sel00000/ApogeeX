# Solar-analog stars for the relative spectral calibration of SPHEREx asteroid reflectance
# (src/preprocessing/solar_analog_calibration.py; build with `python main.py solar-analog-calibration`).
# Stars with `use: false` are kept for reference and skipped by the build.
#
# Group "marsset2020": Table 1 of Marsset et al. (2020), "Twenty years of SpeX: Accuracy limits of
# spectral slope measurements in asteroid spectroscopy", ApJS 247, 73 (arXiv:2004.05158): the solar
# analogs of the SMASS and MITHNEOS asteroid surveys. Name, identifier, J2000 position, spectral type
# and V are copied from that table. From 628 SpeX spectra of these 11 stars the authors find stellar
# mean slopes with a 1-sigma spread of 1.4 %/um (extremes 4.4 %/um apart) over 0.8-2.4 um.
#   gaia_dr3_source_id: the Gaia DR3 source within 10 arcsec of the Table 1 position whose G is within
#   1 mag of V - 0.2 (brightest such source); matched 2026-11-14 via the IRSA TAP copy of
#   gaia_dr3_source (offsets 0.3-2.1 arcsec, G - V = -0.12..-0.19, BP - RP = 0.77-0.82).
#   Most of these stars are too bright for SPHEREx: on DR1 images Landolt 115-271 (V = 9.7) had
#   OVERFLOW at the peak pixel in 39 of 72 exposures and no usable B1/B2 point, while Landolt 110-361
#   (V = 12.4) had no saturation flag in its core (peak ~30 MJy/sr in B1). Stars with V < 10.5 are
#   therefore not used (use: false); 98-978 and 107-998 (V 10.5-10.6) are used, and their saturated
#   points are removed by the core-flag selection of the calibration.
#
# Group "gaia_gold_sample": fainter solar analogs from the Gaia DR3 golden sample of solar analogues
# (Gaia Collaboration, Creevey et al. 2023, A&A 674, A39, Sect. 7.2; archive table
# gaiadr3.gold_sample_solar_analogues, 5863 stars: GSP-Spec Teff = 5772 +/- 100 K, log g = 4.44 +/- 0.25,
# [M/H] = 0 +/- 0.1, FLAME mass 0.95-1.05 Msun, radius 0.8-1.2 Rsun, parallax/error > 20).
# Chosen on 2026-11-14 by src/acquisition/solar_analog_selection.py (select_solar_analogs, seed 0;
# reproduced identically by a second run):
# G 11.3-13.0, |b| > 20 deg, RUWE < 1.4, BP - RP 0.80-0.84 (solar 0.82 +/- 0.02), no Gaia neighbour
# within 30 arcsec brighter than G + 5; 4 stars in each ecliptic-latitude range |beta| 0-20, 20-50 and
# 50-90 deg (candidates sorted by source_id before the seeded draw). 211 of the 5863 stars passed
# the cuts; 2 drawn stars were rejected for neighbours.
#
# notes: facts from Gaia DR3 that may matter for SPHEREx photometry (6.2-arcsec pixels). The joint
# fit and the star-to-star scatter decide how much each star counts.
reference: "Marsset et al. (2020), ApJS 247, 73, Table 1 (arXiv:2004.05158); Gaia Collaboration, Creevey et al. (2023), A&A 674, A39"
selection: "Marsset et al. (2020) Table 1 stars with V >= 10.5, plus 12 Gaia DR3 golden-sample solar analogues (G 11.3-13.0)"
stars:
  - name: "Hyades 64"
    group: "marsset2020"
    use: false
    not_used_reason: "V < 10.5: saturates SPHEREx B1/B2 (see header)"
    identifier: "HD 28099"
    j2000: ["04:26:40.1", "+16:44:49"]
    spectral_type: "G2V"
    V: 8.1
    gaia_dr3_source_id: 3313689422030650496
    notes: "brightest star of the list (G = 7.95)"
