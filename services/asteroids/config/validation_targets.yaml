# Validation targets. Reference values are used ONLY by src/validation to score the system; they
# are never passed to the analysis or classification code.
targets:
  "433":
    name: "433 Eros"
    reference_taxonomy:
      class: "S"
      complex: "S-complex"
      sources:
        - "JPL SBDB spec_B (SMASSII, Bus & Binzel 2002): S"
        - "JPL SBDB spec_T (Tholen): S"
        - "DeMeo et al. 2009 (Bus-DeMeo, 0.45-2.45 um), Appendix: Sw (S with a high slope; class S)"
      cross_check_sbdb_field: "spec_B"
    reference_diameter_km: 16.84       # NEAR Shoemaker volume-equivalent sphere (Yeomans et al. 2000)
    # Window rule (saturation criterion, docs/STAGE_STATUS.md): a validation window must not be
    # saturation-limited in 0.75-2.45 um. Calibration stars are clean at G 11.3-11.8 and saturated at
    # V 10.5-10.6; Eros in 2026-02 (V ~10.7): 38% of its 0.75-2.45 um points saturated. DR1 window with V fainter than 11.5
    # and >= 100 exposures: 2025-07 (191 exposures, V ~13.2). Chosen by this rule before its result was known.
    default_window: ["2025-07-01", "2025-07-31"]
    default_max_images: null          # all exposures (since 2026-11-15; before: 200)
    previous_window: ["2026-02-01", "2026-02-21"]   # saturation-limited; results kept in outputs/windows/2026-02/

  # ---------------------------------------------------------------------------------------------
  # Targets added 2026-11-14 by the class-coverage rule (docs/STAGE_STATUS.md, "Added validation
  # targets"). The rule and the choice below were fixed from the screening numbers (MOST exposure
  # count and predicted V) before any of these targets was analysed:
  #   classes not yet scored: K, L, T, V, R, O, Q, B and the X-complex (16 Psyche saturation-limited);
  #   reference = Bus-DeMeo class in DeMeo et al. (2009, Icarus 202, 160; Appendix), with SMASSII
  #   (SBDB spec_B) in the same class or complex; DR1 window 2025-04-12..2026-10-15, >= 100 exposures;
  #   saturation: predicted V >= 12.0 for every exposure; signal: median predicted V <= 17.5;
  #   brightest median V = primary, second brightest = replicate.
  # Not testable in DR1 under the rule: R (349 Dembowska, V 11.0-12.0), O (3628 Boznemcova, V ~19.0),
  # Q (all Bus-DeMeo Q are NEAs at V > 20 in DR1), B (2 Pallas saturated; 3200, 6411, 1508 at V > 18).
