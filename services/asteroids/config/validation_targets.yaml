        - "JPL SBDB spec_T (Tholen): S"
      cross_check_sbdb_field: "spec_B"
      basis: "visible + near-infrared taxonomy (Bus-DeMeo)"
    screening: {exposures: 310, v_min: 12.52, v_median: 13.19, v_max: 13.36}
    default_window: ["2025-04-12", "2026-10-15"]
